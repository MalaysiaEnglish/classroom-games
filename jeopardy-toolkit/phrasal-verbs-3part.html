}

<body>

<header>
  <h1 id="headerTitle">🎯 Three-Part Phrasal Verbs Jeopardy</h1>
  <div class="header-btns">
    <button class="hbtn" onclick="showSetup()">⚙ Setup</button>
    <button class="hbtn" onclick="document.documentElement.requestFullscreen?.()">⛶ Fullscreen</button>
  </div>
</header>

<div id="setupScreen">
  <div class="setup-title">🎯 Three-Part Phrasal Verbs</div>
  <p class="setup-sub">Questions pre-loaded. Rename teams and click Start.</p>

  <div class="setup-section">
    <label class="setup-label">Quiz Title</label>
    <input class="title-input" id="quizTitle" type="text" value="Three-Part Phrasal Verbs Jeopardy" maxlength="80">
  </div>

  <div class="setup-section">
    <label class="setup-label">Questions (pre-loaded — edit if needed)</label>
    <textarea class="q-paste" id="qPaste" spellcheck="false">CATEGORY: WHAT'S THE MEANING?
Q: What does the three-part phrasal verb "put up with" mean?
A: Tolerate — accept something unpleasant without complaining
Q: What does "run out of" mean?
A: Have no more of something left — exhaust your supply
Q: What does "look up to" mean?
A: Admire and respect someone
Q: What does "make up for" mean?
A: Compensate for something bad — replace something lost or missed
Q: What does "get away with" mean?
A: Do something wrong without being caught or punished

CATEGORY: FILL THE GAP
Q: "I can't _____ the noise from next door." (3-part verb = tolerate)
A: put up with
Q: "We're going to _____ petrol before we reach the motorway." (3-part verb = have none left)
A: run out of
Q: "Can anyone _____ a better idea for the project?" (3-part verb = think of / invent)
A: come up with
Q: "She has always _____ her older sister, who is a doctor." (3-part verb = admired)
A: looked up to
Q: "The pay rise will _____ all the extra hours he worked." (3-part verb = compensate for)
A: make up for

CATEGORY: GRAMMAR RULES
Q: True or false: three-part phrasal verbs can be separated. Is "I can't put it up with" correct?
A: FALSE — three-part phrasal verbs are ALWAYS inseparable. Object comes after all three parts: "I can't put up with it."
Q: Spot the error and correct it: "She looked her teacher up to."
A: Object in wrong place — should be: "She looked up to her teacher." Object always goes after all three parts.
Q: Two-part phrasal verbs can sometimes be separated — e.g. "turn it off." What rule applies to ALL three-part phrasal verbs?
A: They are ALWAYS inseparable — the object must always come after all three parts, never between them.
Q: Which of these is a three-part phrasal verb? a) turn off   b) look up to   c) pick up
A: b) look up to — it has three parts: verb (look) + particle (up) + preposition (to)
Q: Correct the mistake: "He got the punishment away with."
A: "He got away with the punishment." — Object comes after all three parts. Three-part phrasal verbs are inseparable.

CATEGORY: FORD VS FERRARI
Q: "Ford _____ changing the race rules." Which three-part phrasal verb means they escaped punishment?
A: got away with — Ford got away with changing the race rules.
Q: "Ken Miles _____ Carroll Shelby as a mentor." Which three-part verb means he admired him greatly?
A: looked up to
Q: "Ford _____ Ferrari after the deal collapsed." Which three-part verb means they had a serious argument and ended the friendship?
A: fell out with
Q: "Shelby _____ Miles _____ the Ford executives." Which three-part verb means he defended Miles?
A: stood up for — Shelby stood up for Miles against the Ford executives.
Q: "The team victory couldn't _____ Miles losing his win." Which three-part verb means compensate?
A: make up for

CATEGORY: EVERYDAY LIFE
Q: What does "look forward to" mean? Give an example sentence.
A: To eagerly anticipate something. E.g. "I'm really looking forward to the holidays."
Q: "You should _____ sugar and junk food if you want to be healthier." (3-part verb = reduce)
A: cut down on
Q: "Did you _____ the school trip to Paris?" (3-part verb = register for / enrol in)
A: sign up for
Q: "Always _____ your little brother when he's in trouble." (3-part verb = take care of / watch over)
A: look out for
Q: "I don't _____ my new flatmates very well." (3-part verb = have a good relationship with)
A: get on with</textarea>
  </div>

  <div class="setup-section">
    <label class="setup-label">Teams (toggle on/off · click name to rename)</label>

<script>
// ══════════════════════════════════════════════════════════════
//  PARSE
// ══════════════════════════════════════════════════════════════
function parseQuestions(raw) {
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const categories = [];
  let current = null;
  let pendingQ = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^CATEGORY\s*:/i.test(line)) {
      if (pendingQ) throw `Question without answer before "${line}".`;
      const name = line.replace(/^CATEGORY\s*:\s*/i, '').trim();
      if (!name) throw 'Found a CATEGORY: line with no name.';
      current = { name, questions: [] };
      categories.push(current);
    } else if (/^Q\s*:/i.test(line)) {
      if (!current) throw 'Found a Q: line before any CATEGORY:.';
      if (pendingQ) throw `Two Q: lines in a row — missing an A: after: "${pendingQ}"`;
      pendingQ = line.replace(/^Q\s*:\s*/i, '').trim();
      if (!pendingQ) throw 'Found a Q: with no text.';
    } else if (/^A\s*:/i.test(line)) {
      if (!pendingQ) throw `Found an A: without a preceding Q: — near: "${line}"`;
      const answer = line.replace(/^A\s*:\s*/i, '').trim();
      if (!answer) throw 'Found an A: with no answer text.';
      current.questions.push({ q: pendingQ, a: answer });
      pendingQ = null;
    }
  }
  if (pendingQ) throw `Last question has no answer: "${pendingQ}"`;
  if (categories.length < 2) throw 'Please include at least 2 categories.';
  if (categories.length > 6) throw `Too many categories (${categories.length}). Max 6.`;
  for (const cat of categories) {
    if (cat.questions.length < 2) throw `Category "${cat.name}" needs at least 2 questions.`;
    if (cat.questions.length > 5) throw `Category "${cat.name}" has more than 5 questions.`;
  }
  const qCounts = categories.map(c => c.questions.length);
  const minQ = Math.min(...qCounts);
  for (const cat of categories) cat.questions = cat.questions.slice(0, minQ);
  const pts = [100,200,300,400,500];
  for (const cat of categories) cat.questions.forEach((q, i) => { q.pts = pts[i] || (i+1)*100; });
  return categories;
}

// ══════════════════════════════════════════════════════════════
//  TEAMS
// ══════════════════════════════════════════════════════════════
const TEAM_COLORS   = ['#00c9a7','#f7b731','#ef4444','#a29bfe','#38bdf8','#fb923c'];
const DEFAULT_NAMES = ['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6'];
let teamConfig = DEFAULT_NAMES.map((n,i) => ({ name:n, color:TEAM_COLORS[i], active: i < 3 }));

function buildTeamSetup() {
  const el = document.getElementById('teamSetup'); el.innerHTML = '';
  teamConfig.forEach((t,i) => {
    const row = document.createElement('div'); row.className = 'team-row';
    row.innerHTML = `
      <div class="team-dot" style="background:${t.color}"></div>
      <input type="text" value="${t.name}" onchange="teamConfig[${i}].name=this.value" placeholder="Team ${i+1}">
      <div class="team-toggle ${t.active?'on':''}" onclick="toggleTeam(${i})">${t.active?'✓':'+'}</div>`;
    el.appendChild(row);
  });
}

function toggleTeam(i) {
  const active = teamConfig.filter(t=>t.active);
  if (teamConfig[i].active && active.length <= 2) return;
  teamConfig[i].active = !teamConfig[i].active;
  buildTeamSetup();
}

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let CATEGORIES = [], QUESTIONS = [], teams = [], used = [];
let currentTeamIdx = 0, stealTeamIdx = -1, currentCell = null;
let answerRevealed = false, stealing = false;

const CAT_BG  = ['var(--cat0)','var(--cat1)','var(--cat2)','var(--cat3)','var(--cat4)'];
const CAT_LIT = ['var(--cat0-lit)','var(--cat1-lit)','var(--cat2-lit)','var(--cat3-lit)','var(--cat4-lit)'];

function startGame() {
  const raw = document.getElementById('qPaste').value.trim();
  const errEl = document.getElementById('parseError');
  if (errEl) errEl.classList.remove('visible');
  if (!raw) { alert('No questions found.'); return; }
  let parsed;
  try { parsed = parseQuestions(raw); }
  catch(e) { alert('⚠ ' + e); return; }
  CATEGORIES = parsed;
  QUESTIONS  = parsed.map(cat => cat.questions);
  teams = teamConfig.filter(t=>t.active).map(t=>({ name:t.name, color:t.color, score:0 }));
  if (teams.length < 2) { alert('Please enable at least 2 teams.'); return; }
  used = CATEGORIES.map(cat => cat.questions.map(() => false));
  currentTeamIdx = 0; stealing = false; stealTeamIdx = -1;
  const title = document.getElementById('quizTitle').value.trim();
  document.getElementById('headerTitle').textContent = '🎯 ' + (title || 'Jeopardy');
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('boardScreen').style.display = 'block';
  renderBoard(); renderScoreBar(); updateTurnBar();
}

function showSetup() {
  document.getElementById('winOverlay').style.display  = 'none';
  document.getElementById('boardScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'flex';
  buildTeamSetup();
}

// ══════════════════════════════════════════════════════════════
//  BOARD
// ══════════════════════════════════════════════════════════════
function renderBoard() {
  const numCats = CATEGORIES.length;
  const numRows = QUESTIONS[0].length;
  const colTemplate = `repeat(${numCats},1fr)`;
  document.getElementById('catHeaders').style.gridTemplateColumns = colTemplate;
  document.getElementById('boardGrid').style.gridTemplateColumns  = colTemplate;
  const headers = document.getElementById('catHeaders'); headers.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.style.background = CAT_BG[i % CAT_BG.length];
    h.textContent = cat.name;
    headers.appendChild(h);
  });
  const grid = document.getElementById('boardGrid'); grid.innerHTML = '';
  for (let row = 0; row < numRows; row++) {
    for (let cat = 0; cat < numCats; cat++) {
      const cell = document.createElement('div');
      const pts  = QUESTIONS[cat][row].pts;
      const isUsed = used[cat][row];
      cell.className = 'q-cell' + (isUsed ? ' used' : '');
      cell.style.background = isUsed ? '' : CAT_BG[cat % CAT_BG.length];
      cell.textContent = isUsed ? '' : `£${pts}`;
      cell.dataset.cat = cat; cell.dataset.row = row;
      if (!isUsed) cell.onclick = () => openQuestion(cat, row);
      grid.appendChild(cell);
    }
  }
}

function updateCell(cat, row) {
  document.querySelectorAll('.q-cell').forEach(c => {
    if (+c.dataset.cat === cat && +c.dataset.row === row) {
      c.classList.add('used'); c.style.background = ''; c.textContent = ''; c.onclick = null;
    }
  });
}

// ══════════════════════════════════════════════════════════════
//  SCORE BAR
// ══════════════════════════════════════════════════════════════
function renderScoreBar() {
  const bar = document.getElementById('scoreBar'); bar.innerHTML = '';
  teams.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'score-chip'
      + (i === currentTeamIdx && !stealing ? ' active-team' : '')
      + (stealing && i === stealTeamIdx    ? ' stealing'    : '');
    chip.id = `chip-${i}`;
    chip.innerHTML = `<div class="chip-dot" style="background:${t.color}"></div>
      <span class="chip-name">${t.name}</span>
      <span class="chip-score">£${t.score}</span>`;
    bar.appendChild(chip);
  });
}

function updateTurnBar(msg) {
  const t = teams[currentTeamIdx];
  const el = document.getElementById('turnBar');
  el.textContent = msg || `${t.name}'s turn — pick a question`;
  el.style.color  = t.color;
}

// ══════════════════════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════════════════════
function openQuestion(cat, row) {
  currentCell = { cat, row };
  stealing = false; stealTeamIdx = -1; answerRevealed = false;
  const q = QUESTIONS[cat][row];
  document.getElementById('mCat').textContent = CATEGORIES[cat].name;
  document.getElementById('mCat').style.color = CAT_LIT[cat % CAT_LIT.length];
  document.getElementById('mPts').textContent = `£${q.pts}`;
  document.getElementById('mQ').textContent   = q.q;
  document.getElementById('mAns').textContent = `✓ ${q.a}`;
  document.getElementById('mAns').classList.remove('visible');
  document.getElementById('stealBanner').classList.remove('visible');
  document.getElementById('stealPicker').classList.remove('visible');
  buildModalBtns('initial');
  document.getElementById('qModal').style.display = 'flex';
}

function buildModalBtns(state) {
  const btns = document.getElementById('mBtns'); btns.innerHTML = '';
  if (state === 'initial') {
    add('Reveal Answer','mbtn-reveal', revealAnswer);
    add('✓ Correct',    'mbtn-correct', () => judgeAnswer(true));
    add('✗ Wrong',      'mbtn-wrong',   () => judgeAnswer(false));
    add('✕ Skip',       'mbtn-close',   closeModal);
  } else if (state === 'steal') {
    add('Reveal Answer',     'mbtn-reveal',  revealAnswer);
    add('✓ Correct (steal)', 'mbtn-correct', () => judgeSteal(true));
    add('✗ Wrong (steal)',   'mbtn-wrong',   () => judgeSteal(false));
    add('✕ No steal',        'mbtn-close',   () => { closeModal(); advanceTurn(); });
  } else if (state === 'revealed-initial') {
    add('✓ Correct', 'mbtn-correct', () => judgeAnswer(true));
    add('✗ Wrong',   'mbtn-wrong',   () => judgeAnswer(false));
    add('✕ Skip',    'mbtn-close',   closeModal);
  } else if (state === 'revealed-steal') {
    add('✓ Correct (steal)', 'mbtn-correct', () => judgeSteal(true));
    add('✗ Wrong (steal)',   'mbtn-wrong',   () => judgeSteal(false));
    add('✕ No steal',        'mbtn-close',   () => { closeModal(); advanceTurn(); });
  }
  function add(label, cls, fn) {
    const b = document.createElement('button');
    b.className = `mbtn ${cls}`; b.textContent = label; b.onclick = fn;
    btns.appendChild(b);
  }
}

function revealAnswer() {
  answerRevealed = true;
  document.getElementById('mAns').classList.add('visible');
  buildModalBtns(stealing ? 'revealed-steal' : 'revealed-initial');
}

function judgeAnswer(correct) {
  const q = QUESTIONS[currentCell.cat][currentCell.row];
  if (correct) { teams[currentTeamIdx].score += q.pts; playCorrect(); markUsed(); closeModal(); advanceTurn(); }
  else { playWrong(); stealing = true; showStealPicker(); }
}

function showStealPicker() {
  const banner = document.getElementById('stealBanner');
  banner.textContent = `${teams[currentTeamIdx].name} got it wrong — another team can steal!`;
  banner.classList.add('visible');
  const picker = document.getElementById('stealPicker');
  picker.classList.add('visible');
  const stealTeamsEl = document.getElementById('stealTeams'); stealTeamsEl.innerHTML = '';
  teams.forEach((t, i) => {
    if (i === currentTeamIdx) return;
    const btn = document.createElement('button');
    btn.className = 'steal-team-btn' + (i === stealTeamIdx ? ' selected' : '');
    btn.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${t.color};display:inline-block;"></span> ${t.name}`;
    btn.onclick = () => { stealTeamIdx = i; renderScoreBar(); showStealPicker(); buildModalBtns(answerRevealed ? 'revealed-steal' : 'steal'); };
    stealTeamsEl.appendChild(btn);
  });
  buildModalBtns(answerRevealed ? 'revealed-steal' : 'steal');
  renderScoreBar();
}

function judgeSteal(correct) {
  if (stealTeamIdx === -1) { alert('Please select a stealing team first.'); return; }
  const q = QUESTIONS[currentCell.cat][currentCell.row];
  if (correct) { teams[stealTeamIdx].score += q.pts; playCorrect(); }
  else { playWrong(); }
  markUsed(); closeModal();
  if (correct) currentTeamIdx = stealTeamIdx;
  advanceTurn();
}

function markUsed() {
  const { cat, row } = currentCell;
  used[cat][row] = true;
  updateCell(cat, row);
}

function closeModal() {
  document.getElementById('qModal').style.display = 'none';
  stealing = false; stealTeamIdx = -1;
  renderScoreBar();
}

function advanceTurn() {
  const allDone = used.every(col => col.every(v => v));
  if (allDone) { setTimeout(showWin, 400); return; }
  currentTeamIdx = (currentTeamIdx + 1) % teams.length;
  renderScoreBar(); updateTurnBar();
}

// ══════════════════════════════════════════════════════════════
//  WIN
// ══════════════════════════════════════════════════════════════
function showWin() {
  const sorted = [...teams].sort((a,b) => b.score - a.score);
  const winner = sorted[0];
  document.getElementById('winName').textContent = `🎉 ${winner.name} wins with £${winner.score}!`;
  document.getElementById('winName').style.color = winner.color;
  const fs = document.getElementById('finalScores'); fs.innerHTML = '';
  sorted.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'final-row' + (i === 0 ? ' winner' : '');
    row.innerHTML = `<span style="width:10px;height:10px;border-radius:50%;background:${t.color};display:inline-block;"></span>
      <span style="flex:1;font-weight:700">${t.name}</span>
      <span style="font-size:1.2rem;font-weight:900;color:var(--gold)">£${t.score}</span>`;
    fs.appendChild(row);
  });
  document.getElementById('winOverlay').style.display = 'flex';
  playWin();
}

// ══════════════════════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════════════════════
let actx = null;
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function playCorrect() {
  const ctx = ac();
  [523,659,784].forEach((f,i) => {
    const t = ctx.currentTime + i*0.1;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.25);
  });
}
function playWrong() {
  const ctx = ac(), t = ctx.currentTime;
  [300,220].forEach((f,i) => {
    const st = t + i*0.15;
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.25,st); g.gain.exponentialRampToValueAtTime(0.001,st+0.2);
    o.connect(g); g.connect(ctx.destination); o.start(st); o.stop(st+0.2);
  });
}
function playWin() {
  const ctx = ac();
  [523,659,784,1047,1319].forEach((f,i) => {
    const t = ctx.currentTime + i*0.13;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.4);
  });
}

buildTeamSetup();
</script>
</body>
